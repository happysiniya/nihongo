<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2733">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>여행 일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Klee+One:wght@600&display=swap">
<style>
  /* 디자인: 일본 기차 여행. 코스 = 노선, 상황 = 역, 오늘 배울 상황 = 지금 역 (역 이름 표지판) */
  :root {
    --paper: #F2F4F6; --plate: #FFFFFF; --ink: #1C2733; --ink-2: #3A4654; --muted: #687482;
    --hair: #DCE1E6; --soft: #E8ECF0;
    --l0: #687482; --l1: #0A9A86; --l2: #EE7A00; --l3: #2E6CCF; --l4: #C0337F; /* 노선 색: 旅 遊 話 文 */
    --line: var(--l0);
    --ok: #1E9A55; --ok-bg: #E2F3E9; --bad: #D63B3B; --bad-bg: #FBE7E7; --mid: #DC9A00; --mid-bg: #FFF3D4;
    --guide: #D8DEE4; --focus: #2E6CCF;
    --r-lg: 14px; --r: 10px;
    --kr: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --ja: "BIZ UDPGothic", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --hand: "Klee One", "Yu Mincho", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #13171C; --plate: #1C2229; --ink: #E7EBEF; --ink-2: #C3CAD2; --muted: #8B95A0;
      --hair: #2D353F; --soft: #252C34;
      --l1: #2CC4AB; --l2: #FF9B30; --l3: #5C93F2; --l4: #E35FA6;
      --ok: #4CC983; --ok-bg: #173527; --bad: #FF7373; --bad-bg: #432325; --mid: #F2BE3A; --mid-bg: #3A3119;
      --guide: #2D353F; --focus: #5C93F2;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--kr); overscroll-behavior-y: contain; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .jp { font-family: var(--ja); font-weight: 400; letter-spacing: .02em; }
  rt { font-size: .5em; color: var(--muted); font-weight: 400; letter-spacing: .05em; }
  body.nofuri rt { display: none; }
  h2 { font-size: 24px; line-height: 1.3; margin: 8px 0 4px; font-weight: 700; letter-spacing: -.01em; }
  h3 { font-size: 17px; margin: 0 0 10px; font-weight: 700; }
  h4 { font-size: 14px; margin: 18px 0 8px; color: var(--muted); font-weight: 500; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; }

  #view { max-width: 560px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); }
  body.focus #view { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .card { background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 16px; margin: 12px 0; }

  /* 아래 탭 */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
    background: var(--plate); border-top: 1px solid var(--hair); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); }
  body.focus .tabs { display: none; }
  .tabs button { position: relative; flex: 1; max-width: 112px; border: 0; background: none; padding: 8px 0 4px; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .tabs svg, .tabs .kana-ic { display: block; width: 24px; height: 24px; margin: 0 auto 2px; }
  .tabs svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs .kana-ic { font: 700 20px/24px var(--ja); }
  .tabs button.on { color: var(--ink); font-weight: 700; }
  .tabs button.on::before { content: ""; position: absolute; top: -5px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }

  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .listen svg.i { width: 52px; height: 52px; stroke-width: 1.5; }
  .row-item .ic { display: grid; place-items: center; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--hair);
    background: var(--plate); border-radius: var(--r); padding: 11px 14px; font-size: 15px; min-height: 46px; }
  .btn:active, .primary:active, .opt:active, .cell:active, .chunk:active, .row-item:active, .go:active { transform: scale(.98); }
  .btn.on { background: var(--mid-bg); border-color: var(--mid); }
  .btn:disabled { opacity: .4; }
  .primary { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; border: 0;
    background: var(--ink); color: var(--plate); border-radius: var(--r); padding: 14px 16px; font-size: 17px; font-weight: 700; min-height: 54px; }
  .primary small { font-size: 13px; font-weight: 400; opacity: .8; margin-top: 2px; }
  .primary.sub { background: var(--plate); color: var(--ink); border: 1.5px solid var(--ink); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > .btn { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--hair); background: var(--plate); border-radius: 999px; padding: 7px 14px; font-size: 15px; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: var(--plate); }
  .back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); padding: 6px 0; font-size: 15px; }

  /* 기차표 (여행 D-day) */
  .ticket { display: flex; align-items: stretch; background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r); cursor: pointer; }
  .ticket .t-main { flex: 1; padding: 10px 14px; min-width: 0; }
  .ticket .t-main small { display: block; font-size: 12px; color: var(--muted); }
  .ticket .t-main b { display: block; font-size: 15px; font-weight: 500; }
  .ticket .t-stub { display: flex; align-items: center; justify-content: center; min-width: 92px; padding: 10px 14px;
    border-left: 2px dashed var(--hair); font-size: 22px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .ticket.empty .t-stub { font-size: 14px; font-weight: 500; color: var(--focus); }

  /* 역 이름 표지판 (駅名標) */
  .sign { background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); overflow: hidden; margin: 12px 0 0; }
  .sign-plate { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; padding: 20px 18px 16px; }
  .sign-name { display: flex; flex-direction: column; min-width: 0; }
  .sign-jp { font: 700 42px/1.3 var(--ja); letter-spacing: .08em; }
  .sign-jp rt { font-size: 13px; letter-spacing: .3em; }
  .sign-ko { font-size: 16px; color: var(--ink-2); margin-top: 2px; }
  .sign-band { display: flex; justify-content: space-between; gap: 12px; background: var(--line); color: #fff; font-size: 13px; font-weight: 500; padding: 7px 14px; }
  .sign-band span:last-child { text-align: right; }
  .sign.small .sign-plate { padding: 14px 16px 12px; gap: 14px; }
  .sign.small .sign-jp { font-size: 32px; }
  .sign-cap { margin: 0 0 6px; font-size: 13px; color: var(--muted); }

  /* 역 번호 배지 */
  .st { display: inline-grid; place-items: center; align-content: center; width: 44px; height: 44px; flex: none;
    border: 4px solid var(--line); border-radius: 10px; background: var(--plate); line-height: 1.05; position: relative; z-index: 1; }
  .st i { font: 700 11px var(--ja); font-style: normal; color: var(--line); }
  .st b { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  .st.done { background: var(--line); }
  .st.done i, .st.done b { color: #fff; }
  .st.lg { width: 60px; height: 60px; border-width: 5px; border-radius: 12px; }
  .st.lg i { font-size: 13px; }
  .st.lg b { font-size: 23px; }

  /* 홈 */
  .go { display: flex; align-items: center; gap: 14px; width: 100%; margin: 12px 0 0; padding: 16px 18px; border: 0; border-radius: var(--r-lg);
    background: var(--ink); color: var(--plate); text-align: left; }
  .go span { flex: 1; }
  .go b { display: block; font-size: 20px; }
  .go small { display: block; font-size: 14px; opacity: .78; margin-top: 2px; }
  .go svg { width: 40px; height: 40px; flex: none; }
  .go.sub { background: var(--plate); color: var(--ink); border: 1.5px solid var(--ink); }
  .facts { display: grid; grid-template-columns: 1fr 1fr; margin: 18px 4px 0; }
  .facts div + div { border-left: 1px solid var(--hair); padding-left: 16px; }
  .facts b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .facts b small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .facts span { font-size: 13px; color: var(--muted); }
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 2px 8px; }
  .sec-h h3 { margin: 0; }
  .sec-h small { font-size: 13px; color: var(--muted); }

  /* 노선도 (홈) */
  .routes { background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 2px 16px; }
  .route { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; width: 100%; padding: 13px 0; border: 0; background: none; text-align: left; }
  .route + .route { border-top: 1px solid var(--hair); }
  .ln { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--line); color: #fff; font: 700 15px var(--ja); flex: none; }
  .route-top { display: flex; justify-content: space-between; font-size: 14px; }
  .route-top span:last-child { color: var(--muted); }
  .track { position: relative; display: flex; justify-content: space-between; align-items: center; height: 14px; margin-top: 7px; }
  .track::before { content: ""; position: absolute; left: 4px; right: 4px; top: 5px; height: 4px; background: var(--soft); border-radius: 2px; }
  .track .fill { position: absolute; left: 4px; top: 5px; height: 4px; background: var(--line); border-radius: 2px; }
  .track i { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--plate); border: 2px solid var(--hair); }
  .track i.p { border-color: var(--line); }
  .track i.d { background: var(--line); border-color: var(--line); }
  .track i.now { width: 14px; height: 14px; border: 3px solid var(--line); background: var(--plate); animation: now 2.4s ease-in-out infinite; }
  @keyframes now { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--line) 22%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .track i.now { animation: none; } }

  /* 메뉴 목록 (하나의 판 안에 줄로) */
  .menu { background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); overflow: hidden; }
  .row-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 13px 16px; border: 0; background: none; text-align: left; }
  .row-item + .row-item { border-top: 1px solid var(--hair); }
  .row-item .ic { font-size: 20px; text-align: center; }
  .row-item b { display: block; font-size: 15px; font-weight: 500; }
  .row-item small { display: block; font-size: 13px; color: var(--muted); }
  .row-item .chev { color: var(--muted); font-size: 18px; }

  /* 노선 (문장 탭) */
  .course-h { display: flex; align-items: center; gap: 12px; margin: 28px 2px 10px; }
  .course-h b { display: block; font-size: 17px; }
  .course-h small { display: block; font-size: 13px; color: var(--muted); }
  .stations { position: relative; background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); padding: 6px 0; }
  .stations::before { content: ""; position: absolute; left: 35px; top: 30px; bottom: 30px; width: 6px; margin-left: -3px; background: var(--line); border-radius: 3px; }
  .stn { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; width: 100%; padding: 9px 14px; border: 0; background: none; text-align: left; }
  .stn b { display: block; font-size: 16px; font-weight: 500; }
  .stn small { display: block; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .stn .n { font-size: 13px; color: var(--muted); text-align: right; min-width: 48px; font-variant-numeric: tabular-nums; }
  .stn.here .nm::after { content: "오늘"; margin-left: 8px; padding: 1px 7px; border-radius: 99px; background: var(--line); color: #fff; font-size: 11px; font-weight: 700; vertical-align: 2px; }
  .stations.solo::before { display: none; }

  /* 문장 줄 */
  .slist { background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); overflow: hidden; }
  .srow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%;
    border: 0; background: none; padding: 10px 14px; }
  .srow + .srow { border-top: 1px solid var(--hair); }
  .srow .jp { display: block; font-size: 19px; line-height: 1.9; }
  .srow small { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .srow .mk { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--hair); vertical-align: 1px; }
  .dot.l1 { background: var(--mid); border-color: var(--mid); }
  .dot.l2 { background: var(--ok); border-color: var(--ok); }
  .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
  .actions .btn { flex-direction: column; gap: 2px; font-size: 13px; padding: 10px 4px; }
  .actions .btn b { font-size: 20px; font-weight: 400; }
  .actions .btn:first-child { background: var(--ink); color: var(--plate); border-color: var(--ink); }

  /* 문자표 */
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: var(--r); padding: 3px; margin: 8px 0 4px; }
  .seg button { border: 0; background: none; border-radius: 8px; padding: 9px; font-size: 15px; }
  .seg button.on { background: var(--plate); font-weight: 700; box-shadow: 0 0 0 1px var(--hair); }
  .kgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .kgrid.three { grid-template-columns: repeat(3, 1fr); }
  .cell { position: relative; border: 1px solid var(--hair); background: var(--plate); border-radius: var(--r); padding: 6px 0 4px; text-align: center; min-height: 62px; }
  .cell .jp { display: block; font: 600 28px/1.25 var(--hand); }
  .kgrid.three .cell .jp { font-size: 24px; }
  .cell small { display: block; font-size: 12px; color: var(--muted); }
  .cell.empty { border: 0; background: none; }
  .cell.lv1::after, .cell.lv2::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--mid); }
  .cell.lv2::after { background: var(--ok); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin: 8px 0; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }

  /* 아래에서 올라오는 상세 */
  #sheet { position: fixed; inset: 0; z-index: 10; display: none; }
  #sheet.open { display: block; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(12, 18, 26, .5); }
  .sheet-card { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; max-height: 92vh; overflow-y: auto; margin: 0 auto;
    background: var(--plate); border-radius: 18px 18px 0 0; padding: 18px 20px calc(22px + env(safe-area-inset-bottom)); text-align: center; animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet-card { animation: none; } }
  .xbtn { position: absolute; top: 12px; right: 12px; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--soft); font-size: 18px; }
  .sk { font: 600 104px/1.15 var(--hand); cursor: pointer; }
  .sl { font-size: 28px; font-weight: 700; }
  .sl span { font-size: 17px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .tip { background: var(--soft); border-radius: var(--r); padding: 10px 12px; font-size: 14px; margin: 12px 0; text-align: left; }
  .pairline { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .pairline .jp { font: 600 22px var(--hand); color: var(--ink); margin-left: 4px; }
  .sjp { font-size: 27px; line-height: 2.05; margin: 20px 0 0; cursor: pointer; word-break: keep-all; overflow-wrap: anywhere; }
  .skana { color: var(--muted); font-size: 15px; }
  .sko { font-size: 17px; margin: 4px 0 0; color: var(--ink-2); }
  .others { text-align: left; margin: 14px 0; }
  .others h5 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .other { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--hair); background: none; padding: 4px 12px; margin-bottom: 8px; }
  .other .jp { font-size: 17px; line-height: 1.9; }
  .other small { display: block; color: var(--muted); font-size: 13px; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .tools .btn { flex-direction: column; gap: 0; font-size: 12px; padding: 8px 2px; min-height: 58px; }
  .tools .btn b { font-size: 20px; font-weight: 400; }
  #srres:empty { display: none; }
  #srres { background: var(--soft); border-radius: var(--r); padding: 10px 12px; margin-top: 10px; font-size: 14px; text-align: left; }
  #srres .jp { font-size: 17px; }
  .qtitle { text-align: center; color: var(--muted); font-size: 13px; }

  /* 크게 보여주기 */
  #big { position: fixed; inset: 0; z-index: 20; display: none; background: #fff; color: #111; padding: 24px;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #big.open { display: flex; }
  #big .jp { font-size: clamp(30px, 8.5vw, 64px); line-height: 2; word-break: keep-all; overflow-wrap: anywhere; font-weight: 700; }
  #big rt { color: #777; }
  #big p { color: #666; font-size: 18px; }
  #big small { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); color: #999; }

  /* 퀴즈 */
  .qtop { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .qtop .bar { flex: 1; margin: 0; }
  .qtop span { font-size: 14px; color: var(--muted); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .3s; }
  .icon { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--soft); font-size: 18px; flex: none; }
  .qkana { text-align: center; font: 600 116px/1.2 var(--hand); margin: 12px 0 0; cursor: pointer; }
  .qkana.word { font: 400 clamp(38px, 12vw, 60px)/1.3 var(--ja); margin: 34px 0 18px; word-break: keep-all; }
  .listen { display: block; margin: 26px auto 14px; width: 120px; height: 120px; border-radius: 50%; border: 0;
    background: var(--ink); color: var(--plate); font-size: 48px; }
  .hint { text-align: center; color: var(--muted); margin: 0 0 14px; }
  .hint .jp { color: var(--ink); font-size: 21px; line-height: 2; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opts.wide { grid-template-columns: 1fr; }
  .opt { border: 1.5px solid var(--hair); background: var(--plate); border-radius: var(--r); padding: 14px 8px; font-size: 24px; min-height: 72px; font-weight: 700; }
  .opt small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
  .opt .jp { font: 600 38px var(--hand); }
  .opt.wordopt { font-size: 16px; font-weight: 500; }
  .opt.wordopt b { display: block; font-size: 28px; font-weight: 400; }
  .opts.wide .opt { font-size: 16px; min-height: 54px; padding: 12px 14px; text-align: left; font-weight: 400; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.dim { opacity: .4; }
  .feedback { text-align: center; margin: 14px 0 0; font-size: 17px; min-height: 26px; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .result { text-align: center; padding-top: 24px; }

  .grades { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }

  .opool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  /* 따라 쓰기 */
  .wbox { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 6px auto; background: var(--plate);
    border: 1px solid var(--hair); border-radius: var(--r-lg); overflow: hidden;
    background-image: linear-gradient(var(--hair), var(--hair)), linear-gradient(var(--hair), var(--hair));
    background-size: 100% 1px, 1px 100%; background-position: center; background-repeat: no-repeat; }
  .wguide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--guide);
    font: 600 260px/1 var(--hand); pointer-events: none; }

  #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .wlabel { text-align: center; font-size: 21px; font-weight: 700; }
  .wctl { display: grid; grid-template-columns: 52px 1fr 1fr 1fr 52px; gap: 6px; margin-top: 10px; }
  .wctl .btn { padding: 10px 4px; font-size: 14px; }

  /* 가타카나 단어 */
  .wlist { background: var(--plate); border: 1px solid var(--hair); border-radius: var(--r-lg); overflow: hidden; }
  .wrow { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; text-align: left; width: 100%;
    border: 0; background: none; padding: 10px 14px; }

  /* 입력 */
  label.field { display: block; margin: 12px 0; }

  label.field input[type=text], label.field input[type=date], label.field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--hair);
    border-radius: var(--r); background: var(--paper); font-size: 16px; }

<script src="sentences-3.js"></script>

<script>
'use strict';
// ---------- 기본 도구 ----------
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const dayStr = d => d.toLocaleDateString('sv-SE'); // yyyy-mm-dd (기기 시간 기준)
const today = () => dayStr(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return dayStr(d); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

// ---------- 저장된 값 (localStorage 키는 바꾸지 마세요: 학습 기록이 사라져요) ----------
const settings = Object.assign(
  { place: '', trip: '', label: 'ko', chartHint: true, rate: 0.8, chartScript: 'kata',
    furi: true, newPerDay: 5, cardDir: 'ko',
    quiz: { scripts: ['kata'], groups: ['basic'], mode: 'read', n: 10 } },
  LS.get('nh-settings', {}));
const saveSettings = () => LS.set('nh-settings', settings);
const stats = LS.get('nh-stats', {});   // 글자별 { c 맞힘, w 틀림, s 연속 맞힘, t 마지막 시각 }
const wstats = LS.get('nh-wstats', {}); // 가타카나 단어별 같은 형식
const srs = LS.get('nh-srs', {});       // 문장별 { lv 단계, due 다음 복습일, c 맞힘, w 틀림 }
let my = LS.get('nh-my', []);           // 내 문장 [{ id, jp, kana, ko, note, at }]
let favs = LS.get('nh-fav', []);        // 즐겨찾기 문장 id
let newDay = LS.get('nh-newday', { d: '', n: 0 }); // 오늘 새로 배운 문장 수
let days = LS.get('nh-days', []);       // 공부한 날짜들
let unitIdx = LS.get('nh-unit', 0);     // 글자 단계 학습 진도

// ---------- 글자 데이터 ----------
const SCRIPT_NAME = { hira: '히라가나', kata: '가타카나' };
const GROUP_NAME = { basic: '기본', daku: '탁음·반탁음', yoon: '요음' };
const ROWS = [], KANA = [], BY = {};
for (const script of ['hira', 'kata']) {
  for (const [id, name, group, cells] of KANA_ROWS) {
    ROWS.push({ id, script, group, name: script === 'hira' ? name : toKata(name),
      cells: cells.map(c => {
        if (!c) return null;
        const [hk, r, h] = c;
        const k = script === 'hira' ? hk : toKata(hk);
        const o = { k, r, h, script, row: id, group, pair: script === 'hira' ? toKata(hk) : hk };
        KANA.push(o); BY[k] = o;
        return o;
      }) });
  }
}
const rowOf = (script, id) => ROWS.find(r => r.script === script && r.id === id);
const UNITS = [];
const addUnits = (script, defs) => defs.forEach(ids => {
  const rows = ids.map(id => rowOf(script, id));
  UNITS.push({ script, label: SCRIPT_NAME[script] + ' ' + rows.map(r => r.name).join('·'),
    chars: rows.flatMap(r => r.cells.filter(Boolean).map(o => o.k)) });
});
addUnits('hira', BASIC_UNITS); addUnits('kata', BASIC_UNITS);
addUnits('hira', DAKU_UNITS);  addUnits('kata', DAKU_UNITS);
addUnits('hira', YOON_UNITS);  addUnits('kata', YOON_UNITS);
const KATA_START = BASIC_UNITS.length;
const CONF = {};
for (const g of CONFUSE) for (const k of g) CONF[k] = [...new Set([...(CONF[k] || []), ...g.filter(x => x !== k)])];
const WBY = {};
for (const [k, h, ko, e] of WORDS) WBY[k] = { k, h, ko, e };

// ---------- 문장 데이터 ----------
// 한자{읽기} → 후리가나, '/' → 문장 조립 조각
const KANJI = /([々〆ヶ一-鿿]+)\{([^}]+)\}/g;
const rubyHTML = m => esc(m).replace(KANJI, '<ruby>$1<rt>$2</rt></ruby>');
const SENT = {}, BUILTIN = [];
function mkSent(cat, markup, ko, note, others) {
  const plain = markup.replace(KANJI, '$1').replace(/\//g, '');
  const parts = markup.split('/');
  return { id: plain, cat, plain, ko, note: note || '', noteHTML: rubyHTML(note || ''), kana: '',
    html: rubyHTML(markup.replace(/\//g, '')),
    chunks: parts.length >= 3 ? parts.map(c => ({ html: rubyHTML(c), plain: c.replace(KANJI, '$1') })) : null,
    others: (others || []).map(([m, k]) => ({ html: rubyHTML(m.replace(/\//g, '')), plain: m.replace(KANJI, '$1').replace(/\//g, ''), ko: k })) };
}
for (const c of CATEGORIES) for (const [m, ko, note, others] of c.list) {
  const s = mkSent(c.id, m, ko, note, others);
  SENT[s.id] = s; BUILTIN.push(s);
}
let MYS = [];
function buildMy() {
  for (const s of MYS) delete SENT[s.id];
  MYS = my.map(e => {
    const parts = e.jp.trim().split(/\s+/);
    const s = { id: e.id, cat: 'my', my: true, plain: e.jp.replace(/\s+/g, ''), kana: e.kana || '', ko: e.ko, note: e.note || '', noteHTML: esc(e.note || ''),
      html: esc(e.jp.replace(/\s+/g, '')), others: [],
      chunks: parts.length >= 3 ? parts.map(p => ({ html: esc(p), plain: p })) : null };
    SENT[s.id] = s;
    return s;
  });
}
buildMy();
const allSents = () => [...MYS, ...BUILTIN];
const CAT_INFO = { my: { id: 'my', e: '📝', name: '내 문장', desc: '수업에서 배운 문장' }, fav: { id: 'fav', e: '⭐', name: '즐겨찾기', desc: '여행 가서 바로 꺼내 볼 문장' } };
for (const c of CATEGORIES) CAT_INFO[c.id] = c;
function catSents(id) {
  if (id === 'my') return MYS;
  if (id === 'fav') return favs.map(f => SENT[f]).filter(Boolean);
  if (id === 'learned') return allSents().filter(s => srs[s.id]);
  return BUILTIN.filter(s => s.cat === id);
}

// ---------- 학습 기록 ----------
function markDay() {
  const t = today();
  if (!days.includes(t)) { days.push(t); days = days.slice(-500); LS.set('nh-days', days); }
}
function record(store, key, k, ok) {
  const s = store[k] || (store[k] = { c: 0, w: 0, s: 0 });
  if (ok) { s.c++; s.s++; } else { s.w++; s.s = 0; }
  s.t = Date.now();
  LS.set(key, store);
  markDay();
}
const level = (k, store = stats) => { const s = store[k]; return !s ? 0 : s.s >= 3 ? 2 : 1; };
const weight = s => !s ? 3 : (s.s >= 3 ? 1 : 3) + Math.min(s.w, 4) * 0.5;
function pickWeighted(pool, n, store = stats) {
  const items = pool.map(k => ({ k, w: weight(store[k]) })), out = [];
  while (out.length < n && items.length) {
    let r = Math.random() * items.reduce((a, b) => a + b.w, 0), i = 0;
    for (; i < items.length - 1; i++) { r -= items[i].w; if (r <= 0) break; }
    out.push(items.splice(i, 1)[0].k);
  }
  return out;
}
function pickMany(pool, n, store) {
  let out = [];
  while (out.length < n) {
    let next = pickWeighted(pool, Math.min(n - out.length, pool.length), store);
    if (out.length && next[0] === out[out.length - 1] && next.length > 1) next.push(next.shift());
    out = out.concat(next);
  }
  return out;
}
function streak() {
  const set = new Set(days), d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// 문장 간격 반복: 단계(lv)가 오를수록 다음 복습까지 오래 걸려요 (일)
const INTERVALS = [0, 1, 3, 7, 14, 30, 60, 120];
const sLevel = id => { const s = srs[id]; return !s ? 0 : s.lv >= 3 ? 2 : 1; }; // 0 처음, 1 배우는 중, 2 외움
const isDue = id => srs[id] && srs[id].due <= today();
function grade(id, g) { // 0 다시, 1 애매, 2 알아요
  const s = srs[id] || (srs[id] = { lv: 0, due: today(), c: 0, w: 0 });
  if (g === 0) { s.lv = 0; s.w++; s.due = today(); }
  else if (g === 1) { s.lv = Math.max(1, s.lv); s.c++; s.due = addDays(1); }
  else { s.lv = Math.min(s.lv + 1, INTERVALS.length - 1); s.c++; s.due = addDays(INTERVALS[s.lv]); }
  LS.set('nh-srs', srs);
  markDay();
}
function newLeft() { return Math.max(0, settings.newPerDay - (newDay.d === today() ? newDay.n : 0)); }
function countNew() {
  if (newDay.d !== today()) newDay = { d: today(), n: 0 };
  newDay.n++; LS.set('nh-newday', newDay);
}
function plan(cat, extraNew) {
  const pool = cat ? catSents(cat) : allSents();
  const due = pool.filter(s => isDue(s.id)).sort((a, b) => srs[a.id].due < srs[b.id].due ? -1 : 1).slice(0, 30);
  const n = extraNew ?? (cat ? 5 : newLeft());
  const fresh = pool.filter(s => !srs[s.id]).slice(0, n);
  return { due, fresh };
}

// ---------- 소리 ----------
let jaVoice = null;
const hasTTS = 'speechSynthesis' in window;
function loadVoices() {
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /^ja/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (route.v === 'settings') render(); }; }
function speak(text, slow) {
  if (!hasTTS || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = slow ? Math.max(0.4, settings.rate * 0.65) : settings.rate;
  speechSynthesis.speak(u);
}

// ---------- 따라 말하기 (음성 인식) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const norm = t => toHira(t).replace(/[\s、。，．,.!?！？「」『』・ー〜~…]/g, '');
function similar(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  const dp = Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let prev = 0;
    for (let j = 1; j <= b.length; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev + 1 : Math.max(dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return 2 * dp[b.length] / (a.length + b.length);
}
function recognize(id) {
  const box = $('#srres'), s = SENT[id];
  if (!box || !s) return;
  if (!SR) { box.innerHTML = '이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 주세요.'; return; }
  if (rec) { rec.abort(); rec = null; }
  if (hasTTS) speechSynthesis.cancel();
  let got = false;
  rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = false; rec.maxAlternatives = 5;
  box.innerHTML = '🎤 듣고 있어요… 문장을 말해 보세요';
  rec.onresult = e => {
    got = true;
    const best = [...e.results[0]].map(a => a.transcript)
      .map(t => ({ t, sc: Math.max(similar(t, s.plain), s.kana ? similar(t, s.kana) : 0) }))
      .sort((a, b) => b.sc - a.sc)[0];
    const p = Math.round(best.sc * 100);
    const msg = p >= 90 ? '🎉 완벽해요!' : p >= 70 ? '👍 좋아요! 거의 맞았어요' : '🙂 한 번 더 들어 보고 말해 볼까요?';
    box.innerHTML = `<b>${msg}</b> (${p}점)<br>들린 말: <span class="jp">${esc(best.t)}</span>`;
    markDay();
  };
  rec.onerror = e => {
    got = true;
    box.innerHTML = e.error === 'not-allowed' ? '마이크 사용을 허용해 주세요. (Chrome 주소창 왼쪽 아이콘 → 권한)'
      : e.error === 'no-speech' ? '소리가 들리지 않았어요. 다시 눌러 보세요.' : '알아듣지 못했어요. 다시 해 볼까요?';
  };
  rec.onend = () => { rec = null; if (!got) box.innerHTML = '소리가 들리지 않았어요. 다시 눌러 보세요.'; };
  rec.start();
}

// ---------- 화면 이동 (안드로이드 '뒤로' 버튼 지원) ----------
let route = history.state && history.state.v ? history.state : { v: 'home' };
let quiz = null, deck = null;
function go(r, push = false) {
  const changed = r.v !== route.v;
  route = r;
  push ? history.pushState(r, '') : history.replaceState(r, '');
  render();
  if (changed) window.scrollTo(0, 0);
}
const over = extra => go(Object.assign({}, route, extra), true); // 지금 화면 위에 상세 열기
addEventListener('popstate', e => { route = e.state && e.state.v ? e.state : { v: 'home' }; render(); });
const TAB_OF = { cat: 'sentences', cards: 'home', order: 'home', quiz: 'home', result: 'home',
  quizsetup: 'chart', words: 'chart', intro: 'chart', write: 'chart', myedit: 'my' };
const FOCUS = ['quiz', 'intro', 'write', 'cards', 'order'];

function render() {
  if (rec) { rec.abort(); rec = null; }
  if ((route.v === 'quiz' || route.v === 'result' || route.v === 'order') && !quiz) route = { v: 'home' };
  if (route.v === 'cards' && !deck) route = { v: 'home' };

  if (route.v === 'cat' && !CAT_INFO[route.id]) route = { v: 'sentences' };
  const v = VIEWS[route.v] ? route.v : 'home';
  $('#view').innerHTML = VIEWS[v]();
  const tab = TAB_OF[v] || v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.arg === tab));
  document.body.classList.toggle('focus', FOCUS.includes(v));
  document.body.classList.toggle('nofuri', !settings.furi);
  const sheet = route.sheet ? kanaSheet(route.sheet) : route.ss ? sentSheet(route.ss) : '';
  $('#sheet').innerHTML = sheet;
  $('#sheet').classList.toggle('open', !!sheet);
  const big = route.big && SENT[route.big];
  $('#big').innerHTML = big ? `<div class="jp">${big.html}</div>${big.kana ? `<p>${esc(big.kana)}</p>` : ''}<p>${esc(big.ko)}</p><small>화면을 누르면 닫혀요</small>` : '';
  $('#big').classList.toggle('open', !!big);
  if (v === 'write') mountWrite();
}

function hereCat(fresh) {
  if (fresh && fresh.length) return fresh[0].cat;
  const next = allSents().find(s => !srs[s.id]);
  return next ? next.cat : CATEGORIES[CATEGORIES.length - 1].id;
}
function badge(id, cls = '') {
  const c = CAT_INFO[id], list = catSents(id);
  if (!c.course) return `<span class="st ${cls}"><i></i><b>${id === 'fav' ? '★' : '✎'}</b></span>`;
  const no = CATEGORIES.filter(x => x.course === c.course).findIndex(x => x.id === id) + 1;
  const done = list.length && learnedIn(list) === list.length;
  return `<span class="st ${cls} ${done ? 'done' : ''}" style="--line:var(--l${c.course})"><i>${LINE[c.course]}</i><b>${String(no).padStart(2, '0')}</b></span>`;
}
function signHTML(id, small) {
  const c = CAT_INFO[id], [jp, yomi] = CAT_JP[id] || [c.name];
  const same = c.course ? CATEGORIES.filter(x => x.course === c.course) : [];
  const i = same.findIndex(x => x.id === id), prev = same[i - 1], next = same[i + 1];
  const band = c.course
    ? `<span>${prev ? '◀ ' + prev.name : '출발역'}</span><span>${next ? next.name + ' ▶' : '종점'}</span>`
    : `<span>${c.desc}</span>`;
  return `<div class="sign ${small ? 'small' : ''}" style="--line:var(--l${c.course || 0})">
    <div class="sign-plate">${badge(id, 'lg')}
      <div class="sign-name"><span class="sign-jp" lang="ja">${yomi ? `<ruby>${jp}<rt>${yomi}</rt></ruby>` : jp}</span><span class="sign-ko">${c.name}</span></div>

}
function ticketHTML() {

function startDeck(title, items, push = true) {
  if (!items.length) { alert('지금 복습할 문장이 없어요.'); return; }
  const dir = () => settings.cardDir === 'mix' ? (Math.random() < 0.5 ? 'ko' : 'jp') : settings.cardDir;
  const q = items.map(x => Object.assign({ dir: dir() }, x));
  deck = { title, queue: q.slice(1), cur: q[0], flipped: false, done: 0, reviewed: 0, learned: 0, dir };
  go({ v: 'cards' }, push);
  if (deck.cur.isNew || deck.cur.dir === 'jp') setTimeout(() => speak(SENT[deck.cur.id].plain), 300);
}
function mixDeck(due, fresh) { // 복습 3개마다 새 문장 1개
  const out = [], d = due.map(s => ({ id: s.id })), f = fresh.map(s => ({ id: s.id, isNew: true }));
  while (d.length || f.length) { out.push(...d.splice(0, 3)); if (f.length) out.push(f.shift()); }
  return out;
}
function nextCard() {
  deck.done++;
  if (!deck.queue.length) { go({ v: 'deckdone' }); return; }
  deck.cur = deck.queue.shift(); deck.flipped = false;
  render();
  if (deck.cur.isNew || deck.cur.dir === 'jp') setTimeout(() => speak(SENT[deck.cur.id].plain), 300);
}
const requeue = (id, at) => deck.queue.splice(Math.min(deck.queue.length, at), 0, { id, dir: deck.dir() });

VIEWS.quiz = () => {
  const q = quiz.items[quiz.i], n = quiz.items.length, picked = quiz.picked;
  const kind = quiz.kind, ok = picked && picked === q.k;
  let prompt, optCls = '';
  if (kind === 'word') prompt = `<div class="qkana word jp" data-act="say" data-arg="${q.k}">${q.k}</div>
      <p class="hint">${picked ? `${WBY[q.k].h} · ${WBY[q.k].e} ${WBY[q.k].ko}` : '무슨 뜻일까요?'}</p>`;
  else if (kind === 'sent') {
    optCls = 'wide';
    prompt = `<button class="listen" data-act="ssay" data-arg="${a(q.k)}" aria-label="다시 듣기">${ic('speak')}</button>
      <p class="hint">${picked ? `<span class="jp">${SENT[q.k].html}</span>` : '무슨 뜻일까요? (여러 번 들어도 돼요)'}</p>`;
  }
  else if (q.mode === 'listen') prompt = `<button class="listen" data-act="say" data-arg="${q.k}" aria-label="다시 듣기">${ic('speak')}</button>
      <p class="hint">${picked ? `<span class="jp" style="font-size:28px">${q.k}</span> ${BY[q.k].h}` : '들리는 글자를 고르세요'}</p>`;
  else prompt = `<div class="qkana jp" data-act="say" data-arg="${q.k}">${q.k}</div><p class="hint">어떻게 읽을까요?</p>`;
  const opts = q.opts.map(k => {
    const cls = !picked ? '' : k === q.k ? 'ok' : k === picked ? 'bad' : 'dim';
    let body;
    if (kind === 'word') body = `<b>${WBY[k].e}</b>${esc(WBY[k].ko)}`;
    else if (kind === 'sent') body = esc(SENT[k].ko);
    else if (q.mode === 'listen') body = `<span class="jp">${k}</span>`;
    else body = lab(BY[k]);
    return `<button class="opt ${kind === 'word' ? 'wordopt' : ''} ${cls}" data-act="answer" data-arg="${a(k)}">${body}</button>`;
  }).join('');
  const answerText = kind === 'word' ? WBY[q.k].ko : kind === 'sent' ? esc(SENT[q.k].ko) : BY[q.k].h;
  const fb = !picked ? '' : ok ? `<p class="feedback ok">⭕ 맞았어요!</p>`
    : `<p class="feedback bad">정답은 <b>${answerText}</b></p>
       <button class="primary" style="margin-top:10px" data-act="next">다음</button>`;
  return `
    <div class="qtop"><button class="icon" data-act="back" aria-label="그만하기">✕</button>
      <div class="bar"><i style="width:${pct(quiz.i, n)}%"></i></div><span>${quiz.i + 1}/${n}</span></div>
    <div class="qtitle">${esc(quiz.title)}</div>
    ${prompt}<div class="opts ${optCls}">${opts}</div>${fb}`;
};

// ---------- 퀴즈 만들기 ----------
function sameScriptPool(k) { const o = BY[k]; return KANA.filter(x => x.script === o.script).map(x => x.k); }
function kanaOpts(k, pool) {
  const used = new Set([BY[k].h]), out = [];
  const tryAdd = c => { if (out.length < 3 && BY[c] && c !== k && !used.has(BY[c].h)) { used.add(BY[c].h); out.push(c); } };
  shuffle(CONF[k] || []).slice(0, 2).forEach(tryAdd);
  shuffle(pool.filter(c => BY[c].script === BY[k].script)).forEach(tryAdd);
  shuffle(sameScriptPool(k)).forEach(tryAdd);
  return shuffle([k, ...out]);
}
function wordOpts(k) {
  const used = new Set([WBY[k].ko]), out = [];
  for (const [c, , ko] of shuffle(WORDS)) if (out.length < 3 && !used.has(ko)) { used.add(ko); out.push(c); }
  return shuffle([k, ...out]);
}
function sentOpts(id) {
  const s = SENT[id], used = new Set([s.ko]), out = [];
  const tryAdd = x => { if (out.length < 3 && !used.has(x.ko)) { used.add(x.ko); out.push(x.id); } };
  shuffle(allSents().filter(x => x.cat === s.cat)).forEach(tryAdd);
  shuffle(allSents()).forEach(tryAdd);
  return shuffle([id, ...out]);
}
function startQuiz(q, push = true) {
  quiz = Object.assign({ i: 0, score: 0, wrong: [], picked: null }, q);
  go({ v: q.kind === 'order' ? 'order' : 'quiz' }, push);
  autoSpeak();
}
function autoSpeak() {
  const q = quiz && quiz.items[quiz.i];
  if (!q) return;
  if (quiz.kind === 'sent') setTimeout(() => speak(SENT[q.k].plain), 300);
  else if (q.mode === 'listen') setTimeout(() => speak(q.k), 300);
}
function kanaQuiz({ title, pool, n, mode, optPool }, push = true) {
  const ks = pickMany(pool, n);
  startQuiz({ kind: 'kana', title, again: () => kanaQuiz({ title, pool, n, mode, optPool }, false),
    items: ks.map(k => ({ k, mode: mode === 'mix' ? (Math.random() < 0.5 ? 'listen' : 'read') : mode, opts: kanaOpts(k, optPool || pool) })) }, push);
}
function wordQuiz(push = true, pool) {
  const ks = pool ? shuffle(pool) : pickWeighted(WORDS.map(w => w[0]), 10, wstats);
  startQuiz({ kind: 'word', title: '메뉴판 읽기', again: () => wordQuiz(false),
    items: ks.map(k => ({ k, mode: 'read', opts: wordOpts(k) })) }, push);
}
function sentPool(cat) { // 상황을 안 고르면 배운 문장, 배운 게 적으면 전체
  if (cat) return catSents(cat);
  const l = catSents('learned');
  return l.length >= 4 ? l : allSents();
}
function listenQuiz(cat, push = true, ids) {
  const pool = ids || shuffle(sentPool(cat)).slice(0, 10).map(s => s.id);
  const title = '듣기 퀴즈' + (cat ? ` (${CAT_INFO[cat].name})` : '');
  startQuiz({ kind: 'sent', title, again: () => listenQuiz(cat, false),
    items: shuffle(pool).map(k => ({ k, opts: sentOpts(k) })) }, push);
}
function orderQuiz(cat, push = true, ids) {
  const pool = ids || shuffle(sentPool(cat).filter(s => s.chunks)).slice(0, 8).map(s => s.id);
  if (!pool.length) { alert('조립할 수 있는 문장이 없어요.'); return; }
  const title = '문장 조립' + (cat ? ` (${CAT_INFO[cat].name})` : '');
  startQuiz({ kind: 'order', title, again: () => orderQuiz(cat, false),
    items: shuffle(pool).map(k => {
      const n = SENT[k].chunks.length, idx = [...Array(n).keys()];
      let order = shuffle(idx);
      for (let t = 0; t < 5 && order.every((v, i) => v === i); t++) order = shuffle(idx);
      return { k, order, picked: [], result: null };
    }) }, push);
}
function startKanaToday(push = true) {
  if (unitIdx >= UNITS.length) { kanaQuiz({ title: '글자 복습', pool: KANA.map(o => o.k), n: 15, mode: 'mix' }, push); return; }
  const u = UNITS[unitIdx];
  if (u.chars.some(k => !stats[k])) go({ v: 'intro', unit: unitIdx, list: u.chars, i: 0 }, push);
  else unitQuiz(push);
}
function unitQuiz(push) {
  const u = UNITS[unitIdx];
  const prev = UNITS.slice(0, unitIdx).flatMap(x => x.chars).filter(k => stats[k]);
  const extra = Math.max(0, 12 - u.chars.length);
  const ks = shuffle([...u.chars, ...(prev.length ? pickWeighted(prev, Math.min(extra, prev.length)) : pickMany(u.chars, extra))]);
  const optPool = [...u.chars, ...prev];
  startQuiz({ kind: 'kana', title: '글자 단계 학습 (' + u.label + ')', unitCheck: true, again: () => startKanaToday(false),
    items: ks.map(k => ({ k, mode: stats[k] && stats[k].c > 0 && Math.random() < 0.35 ? 'listen' : 'read', opts: kanaOpts(k, optPool) })) }, push);
}
function finishQuiz() {
  if (quiz.unitCheck && unitIdx < UNITS.length) {
    const u = UNITS[unitIdx];
    if (u.chars.every(k => stats[k] && stats[k].s >= 2)) {
      unitIdx++; LS.set('nh-unit', unitIdx);
      quiz.advanced = unitIdx < UNITS.length ? UNITS[unitIdx].label : '모든 글자를 배웠어요!';
    }
  }
  go({ v: 'result' });
}

// ---------- 따라 쓰기 캔버스 ----------
function mountWrite() {
  const cv = $('#pad'), box = cv.parentElement, dpr = window.devicePixelRatio || 1;
  const size = box.clientWidth;
  cv.width = size * dpr; cv.height = size * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(6, size * 0.04);
  ctx.strokeStyle = getComputedStyle(document.body).color;
  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); last = pos(e);
    ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); };
  cv.onpointermove = e => { if (!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
}

// ---------- 버튼 동작 ----------
let nextTimer = null;
const ACT = {
  tab: v => go({ v }),
  home: () => go({ v: 'home' }),
  back: () => history.back(),
  say: t => speak(t),
  ssay: id => SENT[id] && speak(SENT[id].plain),
  sslow: id => SENT[id] && speak(SENT[id].plain, true),
  rec: id => recognize(id),

  // 문장
  cat: id => go({ v: 'cat', id }, true),
  course: id => { go({ v: 'sentences' }); const el = document.getElementById('co-' + id); if (el) el.scrollIntoView(); },
  ss: id => over({ ss: id }),
  big: id => over({ big: id }),
  fav: id => {
    favs = favs.includes(id) ? favs.filter(x => x !== id) : [id, ...favs];
    LS.set('nh-fav', favs); render();
  },
  study: arg => {
    const push = !['result', 'deckdone', 'cards'].includes(route.v);
    if (arg && arg.startsWith('one:')) { const id = arg.slice(4); startDeck('카드 연습', [{ id, isNew: !srs[id] }], true); return; }
    const cat = arg && arg.startsWith('cat:') ? arg.slice(4) : null;
    const { due, fresh } = plan(cat, arg === 'more' ? 5 : undefined);
    const title = cat ? CAT_INFO[cat].name : '오늘의 문장 학습';
    if (!due.length && !fresh.length) { alert(cat ? '이 상황의 문장을 모두 배웠고, 오늘 복습할 문장도 없어요. 👏' : '오늘 할 분량을 다 했어요!'); return; }
    startDeck(title, mixDeck(due, fresh), push);
  },
  flip: () => { deck.flipped = true; render(); speak(SENT[deck.cur.id].plain); },
  cardseen: () => {
    const id = deck.cur.id;
    if (!srs[id]) { srs[id] = { lv: 0, due: today(), c: 0, w: 0 }; LS.set('nh-srs', srs); countNew(); markDay(); }
    deck.learned++;
    requeue(id, 3);
    nextCard();
  },
  grade: g => {
    g = Number(g);
    const id = deck.cur.id;
    grade(id, g);
    deck.reviewed++;
    if (g === 0) requeue(id, 3);
    nextCard();
  },
  listenquiz: cat => listenQuiz(cat || null, !['result', 'deckdone'].includes(route.v)),
  orderquiz: cat => orderQuiz(cat || null, !['result'].includes(route.v)),
  opick: ci => {
    const q = quiz.items[quiz.i], s = SENT[q.k];
    ci = Number(ci);
    if (q.result != null || q.picked.includes(ci)) return;
    q.picked.push(ci);
    if (q.picked.length === s.chunks.length) {
      q.result = q.picked.map(i => s.chunks[i].plain).join('') === s.chunks.map(c => c.plain).join('');
      if (q.result) quiz.score++; else quiz.wrong.push(q.k);
      markDay();
      speak(s.plain);
    }
    render();
  },
  ounpick: j => { const q = quiz.items[quiz.i]; if (q.result == null) { q.picked.splice(Number(j), 1); render(); } },
  oreset: () => { quiz.items[quiz.i].picked = []; render(); },
  onext: () => { quiz.i++; if (quiz.i >= quiz.items.length) go({ v: 'result' }); else render(); },

  // 내 문장
  myadd: () => go({ v: 'myedit' }, true),
  myedit: id => go({ v: 'myedit', id }, true),
  mytry: () => speak($('#f-jp').value.replace(/\s+/g, '')),
  mysave: () => {
    const jp = $('#f-jp').value.trim(), ko = $('#f-ko').value.trim();
    if (!jp || !ko) { alert('일본어와 한국어 뜻을 적어 주세요.'); return; }
    const data = { jp, ko, kana: $('#f-kana').value.trim(), note: $('#f-note').value.trim() };
    const old = my.find(x => x.id === route.id);
    if (old) {
      if (old.jp.replace(/\s+/g, '') !== jp.replace(/\s+/g, '')) { delete srs[old.id]; LS.set('nh-srs', srs); }
      Object.assign(old, data);
    } else my.unshift(Object.assign({ id: 'my-' + Date.now(), at: today() }, data));
    LS.set('nh-my', my); buildMy();
    history.back();
  },
  mydel: () => {
    if (!confirm('이 문장을 지울까요?')) return;
    const id = route.id;
    my = my.filter(x => x.id !== id); favs = favs.filter(x => x !== id); delete srs[id];
    LS.set('nh-my', my); LS.set('nh-fav', favs); LS.set('nh-srs', srs); buildMy();
    history.back();
  },

  // 글자
  kana: k => { speak(k); over({ sheet: k }); },
  chartscript: v => { settings.chartScript = v; saveSettings(); render(); },
  kanatoday: () => startKanaToday(route.v !== 'result'),
  skiphira: () => { unitIdx = Math.max(unitIdx, KATA_START); LS.set('nh-unit', unitIdx); settings.chartScript = 'kata'; saveSettings(); render(); },
  write: k => {
    const o = BY[k], list = rowOf(o.script, o.row).cells.filter(Boolean).map(x => x.k);
    go({ v: 'write', list, i: list.indexOf(k) }, true);
  },
  wmove: d => { const n = route.list.length; go(Object.assign({}, route, { i: (route.i + Number(d) + n) % n })); },
  clear: () => mountWrite(),
  guide: () => go(Object.assign({}, route, { hide: !route.hide })),
  introNext: () => {
    if (route.i < route.list.length - 1) { go(Object.assign({}, route, { i: route.i + 1 })); speak(route.list[route.i]); }
    else unitQuiz(false);
  },
  introPrev: () => { go(Object.assign({}, route, { i: route.i - 1 })); speak(route.list[route.i]); },
  qset: arg => {
    const [key, raw] = arg.split(':'), q = settings.quiz;
    if (Array.isArray(q[key])) q[key] = q[key].includes(raw) ? q[key].filter(x => x !== raw) : [...q[key], raw];
    else q[key] = key === 'n' ? Number(raw) : raw;
    saveSettings(); render();
  },
  freequiz: () => {
    const q = settings.quiz;
    kanaQuiz({ title: q.scripts.map(s => SCRIPT_NAME[s]).join('+') + ' · ' + q.groups.map(g => GROUP_NAME[g]).join('·'), pool: freePool(), n: q.n, mode: q.mode });
  },
  confquiz: () => {
    const scripts = settings.quiz.scripts.length ? settings.quiz.scripts : ['hira', 'kata'];
    kanaQuiz({ title: '헷갈리는 글자', pool: Object.keys(CONF).filter(k => scripts.includes(BY[k].script)), n: 10, mode: 'read' });
  },
  wordquiz: () => wordQuiz(),

  // 퀴즈 공통
  answer: k => {
    if (!quiz || quiz.picked) return;
    const q = quiz.items[quiz.i], ok = k === q.k;
    quiz.picked = k;
    if (quiz.kind === 'word') record(wstats, 'nh-wstats', q.k, ok);
    else if (quiz.kind === 'kana') record(stats, 'nh-stats', q.k, ok);
    else markDay();
    if (ok) quiz.score++; else quiz.wrong.push(q.k);
    speak(quiz.kind === 'sent' ? SENT[q.k].plain : q.k);
    render();
    clearTimeout(nextTimer);
    if (ok) nextTimer = setTimeout(() => { if (quiz && quiz.picked && route.v === 'quiz') ACT.next(); }, quiz.kind === 'sent' ? 1600 : 1000);
  },
  next: () => {
    clearTimeout(nextTimer);
    quiz.picked = null; quiz.i++;
    if (quiz.i >= quiz.items.length) finishQuiz();
    else { render(); autoSpeak(); }
  },
  retrywrong: () => {
    const wrong = [...new Set(quiz.wrong)], old = quiz;
    if (old.kind === 'word') wordQuiz(false, wrong);
    else if (old.kind === 'sent') listenQuiz(null, false, wrong);
    else if (old.kind === 'order') orderQuiz(null, false, wrong);
    else {
      const ks = shuffle([...wrong, ...wrong]).slice(0, Math.max(wrong.length, Math.min(10, wrong.length * 2)));
      startQuiz({ kind: 'kana', title: '틀린 글자 다시', again: old.again,
        items: ks.map(k => ({ k, mode: 'read', opts: kanaOpts(k, sameScriptPool(k)) })) }, false);
    }
    quiz.again = old.again;
  },
  again: () => quiz.again(),

  // 설정
  setv: arg => {
    const [key, raw] = arg.split(':');
    settings[key] = typeof settings[key] === 'number' ? Number(raw) : raw;
    saveSettings(); render();
  },
  export: () => {
    const data = { app: 'nihongo-travel', v: 2, at: new Date().toISOString(), settings, stats, wstats, srs, my, favs, newDay, days, unitIdx };
    const el = document.createElement('a');
    el.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    el.download = `일본어-백업-${today()}.json`;
    el.click();
    setTimeout(() => URL.revokeObjectURL(el.href), 5000);
  },
  import: () => $('#importFile').click(),
  reset: () => {
    if (!confirm('학습 기록(글자·문장 복습 기록, 연속 학습일)을 모두 지울까요?\n내 문장, 즐겨찾기, 여행 날짜는 남겨 둬요.')) return;
    ['nh-stats', 'nh-wstats', 'nh-srs', 'nh-newday', 'nh-days', 'nh-unit'].forEach(k => localStorage.removeItem(k));
    location.reload();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.stopPropagation(); fn(el.dataset.arg, el); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile' && el.files[0]) {
    el.files[0].text().then(t => {
      const d = JSON.parse(t);
      if (d.app !== 'nihongo-travel') throw new Error();
      const put = { 'nh-settings': d.settings, 'nh-stats': d.stats, 'nh-wstats': d.wstats, 'nh-srs': d.srs, 'nh-my': d.my,
        'nh-fav': d.favs, 'nh-newday': d.newDay, 'nh-days': d.days, 'nh-unit': d.unitIdx };
      for (const [k, v] of Object.entries(put)) if (v !== undefined) LS.set(k, v);
      alert('기록을 불러왔어요.');
      location.reload();
    }).catch(() => alert('백업 파일이 아니에요. 이 앱에서 저장한 파일을 골라 주세요.'));
    return;
  }
  const key = el.dataset.set;
  if (!key) return;
  settings[key] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? Number(el.value) : el.value.trim();
  saveSettings();
  if (key === 'rate') { render(); speak('ゆっくり話してください'); }
  if (key === 'furi') render();
});

// 주소 해시로 화면 바로 열기 (스크린샷 확인용)
//   화면: #sentences #my #chart #words #settings #quizsetup #myedit   상황: #cat=food
//   동작: #study #listenquiz #orderquiz #kanatoday #freequiz #wordquiz   상세: #ss=문장 #big=문장 #sheet=あ #write=あ
const hash = decodeURIComponent(location.hash.slice(1));
const [hk, hv] = hash.split('=');
if (hash) history.replaceState(null, '', location.pathname);
if (VIEWS[hash]) go({ v: hash });
else if (hk === 'cat' && CAT_INFO[hv]) go({ v: 'cat', id: hv });
else if ((hk === 'ss' || hk === 'big') && SENT[hv]) { go({ v: 'sentences' }); over({ [hk]: hv }); }
else if (hk === 'sheet' && BY[hv]) { go({ v: 'chart' }); over({ sheet: hv }); }
else if (hk === 'write' && BY[hv]) { go({ v: 'chart' }); ACT.write(hv); }
else if (ACT[hash] && /quiz|study|today/.test(hash)) { go({ v: 'home' }); ACT[hash](); }
else render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>

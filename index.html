<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9482b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>여행 일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Klee+One:wght@400;600&display=swap">
<style>
  :root {
    --bg: #f7f3ec; --card: #fffdf9; --ink: #2b2a33; --muted: #7b7685; --line: #e8e1d5; --soft: #f1ebe1;
    --accent: #d9482b; --accent-soft: #fbe7e1; --indigo: #34437a;
    --ok: #23885a; --ok-bg: #dff3e8; --bad: #cf3e3e; --bad-bg: #fbe4e4; --mid: #e2a400;
    --guide: #e3dccf; --shadow: 0 1px 2px rgba(40,30,20,.06), 0 6px 18px rgba(40,30,20,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a20; --card: #25242c; --ink: #ecebf0; --muted: #a29eac; --line: #393743; --soft: #2f2e37;
      --accent: #ef6a4c; --accent-soft: #3d2620; --indigo: #a8b6ef;
      --ok: #5fd39a; --ok-bg: #1d3a2c; --bad: #ff7d7d; --bad-bg: #452426; --mid: #f0c040;
      --guide: #3b3944; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1.5;
    font-family: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; overscroll-behavior-y: contain; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  input, select { font: inherit; color: inherit; }
  .jp { font-family: "Klee One", "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; font-weight: 600; }
  h2 { font-size: 24px; margin: 6px 0 4px; }
  h3 { font-size: 18px; margin: 0 0 10px; }
  h4 { font-size: 15px; margin: 14px 0 8px; color: var(--muted); font-weight: normal; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 14px; }

  #view { max-width: 560px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  body.focus #view { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }

  /* 아래 탭 */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
    background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  body.focus .tabs { display: none; }
  .tabs button { flex: 1; max-width: 112px; border: 0; background: none; padding: 4px 0; font-size: 12px; color: var(--muted); line-height: 1.3; }
  .tabs button b { display: block; font-size: 22px; font-weight: normal; filter: grayscale(1); opacity: .7; }
  .tabs button.on { color: var(--accent); font-weight: bold; }
  .tabs button.on b { filter: none; opacity: 1; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
    background: var(--card); border-radius: 14px; padding: 12px 16px; font-size: 17px; min-height: 48px; }
  .btn:active, .primary:active, .opt:active, .cell:active { transform: scale(.97); }
  .primary { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; border: 0;
    background: var(--accent); color: #fff; border-radius: 18px; padding: 16px; font-size: 20px; font-weight: bold; min-height: 56px; }
  .primary small { font-size: 14px; font-weight: normal; opacity: .9; margin-top: 2px; }
  .primary.big { padding: 22px 16px; font-size: 23px; margin: 14px 0 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > .btn { flex: 1; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 8px 14px; font-size: 16px; }
  .chip.on { background: var(--indigo); border-color: var(--indigo); color: var(--card); }

  /* 홈 */
  .dday { background: linear-gradient(135deg, var(--accent), #e9784f); color: #fff; border-radius: 20px; padding: 18px 20px;
    font-size: 18px; box-shadow: var(--shadow); }
  .dday b { display: block; font-size: 40px; line-height: 1.1; letter-spacing: -1px; }
  .dday.empty { background: var(--card); color: var(--ink); border: 1px dashed var(--muted); text-align: center; cursor: pointer; font-size: 16px; }
  .dday.empty u { color: var(--accent); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 14px; color: var(--muted); }
  .prog { margin: 10px 0; }
  .prog div { display: flex; justify-content: space-between; font-size: 15px; }
  .bar { height: 10px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  .shortcuts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .shortcuts button { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 6px; font-size: 14px; line-height: 1.3; }
  .shortcuts b { display: block; font-size: 26px; font-weight: normal; margin-bottom: 4px; }

  /* 문자표 */
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--soft); border-radius: 14px; padding: 4px; margin: 8px 0 4px; }
  .seg button { border: 0; background: none; border-radius: 10px; padding: 10px; font-size: 17px; }
  .seg button.on { background: var(--card); box-shadow: var(--shadow); font-weight: bold; }
  .kgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .kgrid.three { grid-template-columns: repeat(3, 1fr); }
  .cell { position: relative; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 0 4px; text-align: center; min-height: 64px; }
  .cell .jp { display: block; font-size: 30px; line-height: 1.2; }
  .kgrid.three .cell .jp { font-size: 26px; }
  .cell small { display: block; font-size: 13px; color: var(--muted); }
  .cell.empty { border: 0; background: none; }
  .cell.lv1::after, .cell.lv2::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--mid); }
  .cell.lv2::after { background: var(--ok); }
  .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 8px 0; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }

  /* 글자 상세 */
  #sheet { position: fixed; inset: 0; z-index: 10; display: none; }
  #sheet.open { display: block; }
  .sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  .sheet-card { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--card);
    border-radius: 24px 24px 0 0; padding: 18px 20px calc(22px + env(safe-area-inset-bottom)); text-align: center; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .xbtn { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--soft); font-size: 20px; }
  .sk { font-size: 110px; line-height: 1.15; cursor: pointer; }
  .sl { font-size: 30px; font-weight: bold; }
  .sl span { font-size: 18px; color: var(--muted); font-weight: normal; margin-left: 6px; }
  .tip { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 15px; margin: 12px 0; text-align: left; }
  .pairline { color: var(--muted); font-size: 15px; margin: 6px 0 14px; }
  .pairline .jp { font-size: 22px; color: var(--ink); margin-left: 4px; }

  /* 퀴즈 */
  .qtop { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .qtop .bar { flex: 1; margin: 0; }
  .qtop span { font-size: 15px; color: var(--muted); min-width: 44px; text-align: right; }
  .icon { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--soft); font-size: 20px; flex: none; }
  .qtitle { text-align: center; color: var(--muted); font-size: 15px; }
  .qkana { text-align: center; font-size: 120px; line-height: 1.2; margin: 12px 0 0; cursor: pointer; }
  .qkana.word { font-size: clamp(40px, 13vw, 64px); margin: 34px 0 18px; word-break: keep-all; }
  .listen { display: block; margin: 26px auto 14px; width: 130px; height: 130px; border-radius: 50%; border: 0;
    background: var(--accent-soft); font-size: 56px; }
  .hint { text-align: center; color: var(--muted); margin: 0 0 14px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 8px; font-size: 26px; min-height: 76px; font-weight: bold; }
  .opt small { display: block; font-size: 14px; color: var(--muted); font-weight: normal; }
  .opt .jp { font-size: 40px; }
  .opt.wordopt { font-size: 18px; }
  .opt.wordopt b { display: block; font-size: 30px; font-weight: normal; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); }
  .opt.dim { opacity: .45; }
  .feedback { text-align: center; margin: 14px 0 0; font-size: 18px; min-height: 28px; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .result { text-align: center; padding-top: 20px; }
  .result .score { font-size: 64px; font-weight: bold; line-height: 1.1; }
  .unlock { background: var(--ok-bg); color: var(--ok); border-radius: 14px; padding: 12px; margin: 14px 0; font-size: 18px; }
  .wrongs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 10px 0; }
  .wrongs button { border: 1px solid var(--bad); background: var(--bad-bg); border-radius: 12px; padding: 4px 12px; font-size: 26px; }
  .stack { display: grid; gap: 10px; margin-top: 18px; }

  /* 새 글자 소개 */
  .intro { text-align: center; }
  .intro .sk { font-size: 150px; margin-top: 10px; }

  /* 따라 쓰기 */
  .wbox { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 6px auto; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    background-image: linear-gradient(var(--line), var(--line)), linear-gradient(var(--line), var(--line));
    background-size: 100% 1px, 1px 100%; background-position: center; background-repeat: no-repeat; }
  .wguide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--guide);
    font-size: 260px; line-height: 1; pointer-events: none; }
  .wbox.long .wguide { font-size: 150px; }
  .wguide.hidden { visibility: hidden; }
  #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .wlabel { text-align: center; font-size: 22px; font-weight: bold; }
  .wctl { display: grid; grid-template-columns: 56px 1fr 1fr 1fr 56px; gap: 8px; margin-top: 10px; }
  .wctl .btn { padding: 10px 4px; font-size: 15px; }

  /* 단어 */
  .wlist { display: grid; gap: 8px; }
  .wrow { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; text-align: left;
    border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; }
  .wrow .e { font-size: 28px; text-align: center; }
  .wrow .jp { font-size: 22px; display: block; line-height: 1.3; }
  .wrow small { color: var(--muted); font-size: 14px; }
  .wrow .m { font-size: 15px; color: var(--muted); }
  details.card summary { font-weight: bold; cursor: pointer; }
  .rule { display: grid; grid-template-columns: 64px 1fr; gap: 6px 10px; align-items: baseline; margin-top: 12px; font-size: 15px; }
  .rule .jp { font-size: 26px; text-align: center; color: var(--accent); }

  /* 설정 */
  label.field { display: block; margin: 12px 0; }
  label.field span { display: block; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
  label.field input[type=text], label.field input[type=date] { width: 100%; padding: 12px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--bg); font-size: 17px; }
  label.check { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
  label.check input { width: 22px; height: 22px; accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .voice { font-size: 15px; padding: 10px 12px; border-radius: 12px; background: var(--soft); margin: 8px 0; }
  .voice.warn { background: var(--bad-bg); }
</style>
</head>
<body>
<main id="view"></main>
<div id="sheet"></div>
<nav class="tabs">
  <button data-act="tab" data-arg="home"><b>🏠</b>홈</button>
  <button data-act="tab" data-arg="chart"><b>あ</b>문자표</button>
  <button data-act="tab" data-arg="quizsetup"><b>✏️</b>퀴즈</button>
  <button data-act="tab" data-arg="words"><b>🍜</b>메뉴 읽기</button>
  <button data-act="tab" data-arg="settings"><b>⚙️</b>설정</button>
</nav>
<script src="data.js"></script>
<script>
'use strict';
// ---------- 기본 도구 ----------
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const dayStr = d => d.toLocaleDateString('sv-SE'); // yyyy-mm-dd (기기 시간 기준)
const today = () => dayStr(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));

// ---------- 저장된 값 (localStorage 키는 바꾸지 마세요: 학습 기록이 사라져요) ----------
const settings = Object.assign(
  { place: '', trip: '', label: 'ko', chartHint: true, rate: 0.8, chartScript: 'hira',
    quiz: { scripts: ['hira'], groups: ['basic'], mode: 'read', n: 10 } },
  LS.get('nh-settings', {}));
const saveSettings = () => LS.set('nh-settings', settings);
const stats = LS.get('nh-stats', {});   // 글자별 { c 맞힘, w 틀림, s 연속 맞힘, t 마지막 시각 }
const wstats = LS.get('nh-wstats', {}); // 단어별 같은 형식
let days = LS.get('nh-days', []);       // 공부한 날짜들
let unitIdx = LS.get('nh-unit', 0);     // 오늘의 학습 진도

// ---------- 글자 데이터 만들기 ----------
const SCRIPT_NAME = { hira: '히라가나', kata: '가타카나' };
const GROUP_NAME = { basic: '기본', daku: '탁음·반탁음', yoon: '요음' };
const ROWS = [], KANA = [], BY = {};
for (const script of ['hira', 'kata']) {
  for (const [id, name, group, cells] of KANA_ROWS) {
    ROWS.push({ id, script, group, name: script === 'hira' ? name : toKata(name),
      cells: cells.map(c => {
        if (!c) return null;
        const [hk, r, h] = c;
        const k = script === 'hira' ? hk : toKata(hk);
        const o = { k, r, h, script, row: id, group, pair: script === 'hira' ? toKata(hk) : hk };
        KANA.push(o); BY[k] = o;
        return o;
      }) });
  }
}
const rowOf = (script, id) => ROWS.find(r => r.script === script && r.id === id);
const UNITS = [];
const addUnits = (script, defs) => defs.forEach(ids => {
  const rows = ids.map(id => rowOf(script, id));
  UNITS.push({ script, label: SCRIPT_NAME[script] + ' ' + rows.map(r => r.name).join('·'),
    chars: rows.flatMap(r => r.cells.filter(Boolean).map(o => o.k)) });
});
addUnits('hira', BASIC_UNITS); addUnits('kata', BASIC_UNITS);
addUnits('hira', DAKU_UNITS);  addUnits('kata', DAKU_UNITS);
addUnits('hira', YOON_UNITS);  addUnits('kata', YOON_UNITS);
const CONF = {};
for (const g of CONFUSE) for (const k of g) CONF[k] = [...new Set([...(CONF[k] || []), ...g.filter(x => x !== k)])];
const WBY = {};
for (const [k, h, ko, e] of WORDS) WBY[k] = { k, h, ko, e };

// ---------- 학습 기록 ----------
function markDay() {
  const t = today();
  if (!days.includes(t)) { days.push(t); days = days.slice(-500); LS.set('nh-days', days); }
}
function record(store, key, k, ok) {
  const s = store[k] || (store[k] = { c: 0, w: 0, s: 0 });
  if (ok) { s.c++; s.s++; } else { s.w++; s.s = 0; }
  s.t = Date.now();
  LS.set(key, store);
  markDay();
}
const level = (k, store = stats) => { const s = store[k]; return !s ? 0 : s.s >= 3 ? 2 : 1; }; // 0 처음, 1 연습 중, 2 외움
const weight = s => !s ? 3 : (s.s >= 3 ? 1 : 3) + Math.min(s.w, 4) * 0.5; // 약한 글자일수록 자주
function pickWeighted(pool, n, store = stats) {
  const items = pool.map(k => ({ k, w: weight(store[k]) })), out = [];
  while (out.length < n && items.length) {
    let r = Math.random() * items.reduce((a, b) => a + b.w, 0), i = 0;
    for (; i < items.length - 1; i++) { r -= items[i].w; if (r <= 0) break; }
    out.push(items.splice(i, 1)[0].k);
  }
  return out;
}
function pickMany(pool, n, store) { // 문제 수가 글자 수보다 많으면 여러 번 돌려요
  let out = [];
  while (out.length < n) {
    let next = pickWeighted(pool, Math.min(n - out.length, pool.length), store);
    if (out.length && next[0] === out[out.length - 1] && next.length > 1) next.push(next.shift());
    out = out.concat(next);
  }
  return out;
}
function streak() {
  const set = new Set(days), d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dayStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- 소리 (안드로이드 Chrome의 일본어 음성) ----------
let jaVoice = null;
const hasTTS = 'speechSynthesis' in window;
function loadVoices() {
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /^ja/i.test(v.lang) && /google/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (route.v === 'settings') render(); }; }
function speak(text) {
  if (!hasTTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if (jaVoice) u.voice = jaVoice;
  u.rate = settings.rate;
  speechSynthesis.speak(u);
}

// ---------- 화면 이동 (안드로이드 '뒤로' 버튼 지원) ----------
let route = history.state && history.state.v ? history.state : { v: 'home' };
let quiz = null;
function go(r, push = false) {
  const changed = r.v !== route.v;
  route = r;
  push ? history.pushState(r, '') : history.replaceState(r, '');
  render();
  if (changed) window.scrollTo(0, 0);
}
addEventListener('popstate', e => { route = e.state && e.state.v ? e.state : { v: 'home' }; render(); });
const TAB_OF = { quiz: 'quizsetup', result: 'quizsetup', intro: 'home', write: 'chart' };

function render() {
  if ((route.v === 'quiz' || route.v === 'result') && !quiz) route = { v: 'home' };
  if (route.v === 'intro' && !route.list) route = { v: 'home' };
  if (route.v === 'write' && !route.list) route = { v: 'chart' };
  const v = VIEWS[route.v] ? route.v : 'home';
  $('#view').innerHTML = VIEWS[v]();
  const tab = TAB_OF[v] || v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.arg === tab));
  document.body.classList.toggle('focus', ['quiz', 'intro', 'write'].includes(v));
  $('#sheet').innerHTML = route.sheet ? sheetHTML(route.sheet) : '';
  $('#sheet').classList.toggle('open', !!route.sheet);
  if (v === 'write') mountWrite();
}

const lab = o => settings.label === 'ro' ? esc(o.r) : settings.label === 'both' ? `${o.h}<small>${o.r}</small>` : o.h;

  const isWord = quiz.kind === 'word';

  let prompt;
  if (isWord) prompt = `<div class="qkana word jp" data-act="say" data-arg="${q.k}">${q.k}</div>
      <p class="hint">${picked ? `${WBY[q.k].h} · ${WBY[q.k].e} ${WBY[q.k].ko}` : '무슨 뜻일까요?'}</p>`;
  else if (q.mode === 'listen') prompt = `<button class="listen" data-act="say" data-arg="${q.k}" aria-label="다시 듣기">🔊</button>
      <p class="hint">${picked ? `<span class="jp" style="font-size:28px">${q.k}</span> ${BY[q.k].h}` : '들리는 글자를 고르세요'}</p>`;
  else prompt = `<div class="qkana jp" data-act="say" data-arg="${q.k}">${q.k}</div><p class="hint">어떻게 읽을까요?</p>`;
  const opts = q.opts.map(k => {
    const cls = !picked ? '' : k === q.k ? 'ok' : k === picked ? 'bad' : 'dim';
    let body;
    if (isWord) body = `<b>${WBY[k].e}</b>${esc(WBY[k].ko)}`;

    return `<button class="opt ${isWord ? 'wordopt' : ''} ${cls}" data-act="answer" data-arg="${k}">${body}</button>`;

// ---------- 퀴즈 만들기 ----------
function sameScriptPool(k) { const o = BY[k]; return KANA.filter(x => x.script === o.script).map(x => x.k); }
function kanaOpts(k, pool) {
  const used = new Set([BY[k].h]), out = [];
  const tryAdd = c => { if (out.length < 3 && BY[c] && c !== k && !used.has(BY[c].h)) { used.add(BY[c].h); out.push(c); } };
  shuffle(CONF[k] || []).slice(0, 2).forEach(tryAdd);
  shuffle(pool.filter(c => BY[c].script === BY[k].script)).forEach(tryAdd);
  shuffle(sameScriptPool(k)).forEach(tryAdd);
  return shuffle([k, ...out]);
}
function wordOpts(k) {
  const used = new Set([WBY[k].ko]), out = [];
  for (const [c, , ko] of shuffle(WORDS)) if (out.length < 3 && !used.has(ko)) { used.add(ko); out.push(c); }
  return shuffle([k, ...out]);
}
function startQuiz(q, push = true) {
  quiz = Object.assign({ i: 0, score: 0, wrong: [], picked: null }, q);
  go({ v: 'quiz' }, push);
  autoSpeak();
}
function autoSpeak() {
  const q = quiz && quiz.items[quiz.i];
  if (q && q.mode === 'listen') setTimeout(() => speak(q.k), 300);
}
function kanaQuiz({ title, pool, n, mode, optPool }, push = true) {
  const ks = pickMany(pool, n);
  const make = () => kanaQuiz({ title, pool, n, mode, optPool }, false);
  startQuiz({ kind: 'kana', title, again: make,
    items: ks.map(k => ({ k, mode: mode === 'mix' ? (Math.random() < 0.5 ? 'listen' : 'read') : mode, opts: kanaOpts(k, optPool || pool) })) }, push);
}
function wordQuiz(push = true, pool) {
  const ks = pool ? shuffle(pool) : pickWeighted(WORDS.map(w => w[0]), 10, wstats);
  startQuiz({ kind: 'word', title: '메뉴판 읽기', again: () => wordQuiz(false),
    items: ks.map(k => ({ k, mode: 'read', opts: wordOpts(k) })) }, push);
}
function startToday(push = true) {
  if (unitIdx >= UNITS.length) {
    kanaQuiz({ title: '오늘의 복습', pool: KANA.map(o => o.k), n: 15, mode: 'mix' }, push);
    return;
  }
  const u = UNITS[unitIdx];
  if (u.chars.some(k => !stats[k])) go({ v: 'intro', unit: unitIdx, list: u.chars, i: 0 }, push);
  else unitQuiz(push);
}
function unitQuiz(push) {
  const u = UNITS[unitIdx];
  const prev = UNITS.slice(0, unitIdx).flatMap(x => x.chars);
  const extra = Math.max(0, 12 - u.chars.length);
  const ks = shuffle([...u.chars, ...(prev.length ? pickWeighted(prev, Math.min(extra, prev.length)) : pickMany(u.chars, extra))]);
  const optPool = [...u.chars, ...prev];
  startQuiz({ kind: 'kana', title: '오늘의 학습 · ' + u.label, unitCheck: true, again: () => startToday(false),
    items: ks.map(k => ({ k, mode: stats[k] && stats[k].c > 0 && Math.random() < 0.35 ? 'listen' : 'read', opts: kanaOpts(k, optPool) })) }, push);
}
function finishQuiz() {
  if (quiz.unitCheck && unitIdx < UNITS.length) {
    const u = UNITS[unitIdx];
    if (u.chars.every(k => stats[k] && stats[k].s >= 2)) {
      unitIdx++; LS.set('nh-unit', unitIdx);
      quiz.advanced = unitIdx < UNITS.length ? UNITS[unitIdx].label : '모든 글자를 배웠어요!';
    }
  }
  go({ v: 'result' });
}

// ---------- 따라 쓰기 캔버스 ----------
function mountWrite() {
  const cv = $('#pad'), box = cv.parentElement, dpr = window.devicePixelRatio || 1;
  const size = box.clientWidth;
  cv.width = size * dpr; cv.height = size * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(6, size * 0.04);
  ctx.strokeStyle = getComputedStyle(document.body).color;
  let drawing = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { drawing = true; cv.setPointerCapture(e.pointerId); last = pos(e);
    ctx.beginPath(); ctx.arc(last[0], last[1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); };
  cv.onpointermove = e => { if (!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
}

// ---------- 버튼 동작 ----------
let nextTimer = null;
const ACT = {
  tab: a => go({ v: a }),
  home: () => go({ v: 'home' }),
  back: () => history.back(),
  say: a => speak(a),
  kana: a => { speak(a); go(Object.assign({}, route, { sheet: a }), true); },
  closesheet: () => history.back(),
  chartscript: a => { settings.chartScript = a; saveSettings(); render(); },
  today: () => startToday(route.v === 'home'),
  write: a => {
    const o = BY[a], list = rowOf(o.script, o.row).cells.filter(Boolean).map(x => x.k);
    go({ v: 'write', list, i: list.indexOf(a) }, true);
  },
  writeunit: () => {
    const u = UNITS[Math.min(unitIdx, UNITS.length - 1)];
    go({ v: 'write', list: u.chars, i: 0 }, true);
  },
  wmove: a => { const n = route.list.length; go(Object.assign({}, route, { i: (route.i + Number(a) + n) % n })); },
  clear: () => mountWrite(),
  guide: () => go(Object.assign({}, route, { hide: !route.hide })),
  introNext: () => {
    if (route.i < route.list.length - 1) { go(Object.assign({}, route, { i: route.i + 1 })); speak(route.list[route.i]); }
    else unitQuiz(false);
  },
  introPrev: () => { go(Object.assign({}, route, { i: route.i - 1 })); speak(route.list[route.i]); },
  qset: a => {
    const [key, raw] = a.split(':'), q = settings.quiz;
    if (Array.isArray(q[key])) q[key] = q[key].includes(raw) ? q[key].filter(x => x !== raw) : [...q[key], raw];
    else q[key] = key === 'n' ? Number(raw) : raw;
    saveSettings(); render();
  },
  freequiz: () => {
    const q = settings.quiz;
    const title = q.scripts.map(s => SCRIPT_NAME[s]).join('+') + ' · ' + q.groups.map(g => GROUP_NAME[g]).join('·');
    kanaQuiz({ title, pool: freePool(), n: q.n, mode: q.mode });
  },
  confquiz: () => {
    const scripts = settings.quiz.scripts.length ? settings.quiz.scripts : ['hira', 'kata'];
    const pool = Object.keys(CONF).filter(k => scripts.includes(BY[k].script));
    kanaQuiz({ title: '헷갈리는 글자', pool, n: 10, mode: 'read' });
  },
  wordquiz: () => wordQuiz(),
  answer: a => {
    if (!quiz || quiz.picked) return;
    const q = quiz.items[quiz.i], ok = a === q.k;
    quiz.picked = a;
    if (quiz.kind === 'word') record(wstats, 'nh-wstats', q.k, ok); else record(stats, 'nh-stats', q.k, ok);
    if (ok) quiz.score++; else quiz.wrong.push(q.k);
    speak(q.k);
    render();
    clearTimeout(nextTimer);
    if (ok) nextTimer = setTimeout(() => { if (quiz && quiz.picked && route.v === 'quiz') ACT.next(); }, 1000);
  },
  next: () => {
    clearTimeout(nextTimer);
    quiz.picked = null; quiz.i++;
    if (quiz.i >= quiz.items.length) finishQuiz();
    else { render(); autoSpeak(); }
  },
  retrywrong: () => {
    const wrong = [...new Set(quiz.wrong)], kind = quiz.kind, old = quiz;
    if (kind === 'word') { wordQuiz(false, wrong); return; }
    const ks = shuffle([...wrong, ...wrong]).slice(0, Math.max(wrong.length, Math.min(10, wrong.length * 2)));
    startQuiz({ kind: 'kana', title: '틀린 글자 다시', again: old.again,
      items: ks.map(k => ({ k, mode: 'read', opts: kanaOpts(k, sameScriptPool(k)) })) }, false);
  },
  again: () => quiz.again(),
  setlabel: a => { settings.label = a; saveSettings(); render(); },
  export: () => {
    const data = { app: 'nihongo-travel', v: 1, at: new Date().toISOString(), settings, stats, wstats, days, unitIdx };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = `일본어-백업-${today()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  import: () => $('#importFile').click(),
  reset: () => {
    if (!confirm('학습 기록을 모두 지우고 처음부터 시작할까요? (여행 날짜는 남겨 둬요)')) return;
    ['nh-stats', 'nh-wstats', 'nh-days', 'nh-unit'].forEach(k => localStorage.removeItem(k));
    location.reload();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.arg, el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'importFile' && el.files[0]) {
    el.files[0].text().then(t => {
      const d = JSON.parse(t);
      if (d.app !== 'nihongo-travel') throw new Error();
      LS.set('nh-settings', d.settings); LS.set('nh-stats', d.stats); LS.set('nh-wstats', d.wstats);
      LS.set('nh-days', d.days); LS.set('nh-unit', d.unitIdx);
      alert('기록을 불러왔어요.');
      location.reload();
    }).catch(() => alert('백업 파일이 아니에요. 이 앱에서 저장한 파일을 골라 주세요.'));
    return;
  }
  const key = el.dataset.set;
  if (!key) return;
  settings[key] = el.type === 'checkbox' ? el.checked : el.type === 'range' ? Number(el.value) : el.value.trim();
  saveSettings();
  if (key === 'rate') { render(); speak('あいうえお'); }
});

// 주소 해시로 화면 바로 열기 (스크린샷 확인용)
//   화면: #chart #words #settings #quizsetup   동작: #today #freequiz #confquiz #wordquiz   글자: #sheet=あ #write=あ
const hash = decodeURIComponent(location.hash.slice(1));
const [hk, hv] = hash.split('=');
if (hash) history.replaceState(null, '', location.pathname);
if (VIEWS[hash]) go({ v: hash });
else if ((hk === 'sheet' || hk === 'write') && BY[hv]) { go({ v: 'chart' }); hk === 'sheet' ? go({ v: 'chart', sheet: hv }) : ACT.write(hv); }
else if (ACT[hash] && /quiz|today/.test(hash)) { render(); ACT[hash](); }
else render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
